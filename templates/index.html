<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Your Name with Aerial Imagery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5%;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 5%;
        }

        /* Form styling */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 5%;
        }

        input[type="text"] {
            width: 90%;
            max-width: 600px;
            padding: 1.5%;
            font-size: clamp(1rem, 3vw, 1.5rem);
            border: 2px solid #ccc;
            border-radius: 10px;
        }

        button {
            padding: 2% 5%;
            font-size: clamp(1rem, 3vw, 1.5rem);
            background-color: #0B6623;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Image container */
        .name-images {
            display: flex;
            justify-content: center;
            gap: 2%;
            flex-wrap: nowrap;
            overflow-x: auto;
            max-width: 100%;
            margin-top: 5%;
        }

        /* Image scaling */
        .name-images img {
            width: clamp(50px, 8vw, 100px);
            height: auto;
            border: 3px solid black;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- Title -->
    <h1>Spell Your Name with Aerial Imagery</h1>

    <!-- Input form -->
    <form method="POST">
        <input type="text" name="name" placeholder="Enter your name" required>
        <button type="submit">Submit</button>
    </form>

    <!-- Display images dynamically in one row -->
    {% if images %}
        <div class="name-images">
            {% for img in images %}
                <img src="{{ img }}" alt="Letter">
            {% endfor %}
        </div>
    {% endif %}

</body>
</html>
