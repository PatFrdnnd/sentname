<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Your Name with Satellite Images</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
            height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scrolling */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center all content vertically and horizontally */
            padding: 0;
        }

        /* Make form input box fully responsive */
        input[type="text"] {
            width: 80vw; /* Make it 80% of the viewport width */
            max-width: 500px; /* Max size to prevent excessive expansion on large screens */
            padding: 5vw; /* Responsive padding to adjust with viewport */
            font-size: 2vw; /* Font size also responsive to the viewport */
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 5vh; /* Responsive margin for spacing */
        }

        /* Responsive button */
        button {
            padding: 3vw 6vw; /* Make the button size adjust to the viewport */
            font-size: 2vw; /* Dynamic font size */
            background-color: #0B6623;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Image container that stretches and adjusts */
        .name-images {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Allow images to wrap on smaller screens */
            gap: 2vw; /* Dynamic gap between images */
            width: 100%;
            max-width: 100%;
            margin-top: 5vh; /* Margin from the form */
        }

        /* Responsive images, width is 100% of the container with auto height */
        .name-images img {
            width: 10vw; /* Dynamic width based on viewport width */
            height: auto; /* Maintain aspect ratio */
            border: 3px solid black;
            border-radius: 3px;
            max-width: 100%; /* Ensure images do not exceed container */
            flex-shrink: 0; /* Prevent images from shrinking too much */
        }

        /* Banner fixes */
        .banner-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 2vh 0;
        }

        .banner {
            width: 100%;
            max-height: 100px; /* Fixed height for banner */
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Main content -->
    <div>
        <h1>Spell Your Name with Satellite Images</h1>
        <form method="POST">
            <input type="text" name="name" placeholder="Enter your name" required>
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- If images are submitted, display them -->
    {% if images %}
        <div class="name-images">
            <h2>Here is your name from above:</h2>
            {% for img in images %}
                <img src="{{ img }}" alt="Letter">
            {% endfor %}
        </div>
    {% endif %}

    <!-- Banner at the bottom -->
    <div class="banner-container">
        <img src="/static/images/banner.png" alt="Banner" class="banner">
    </div>

</body>
</html>
