<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Your Name with Aerial Imagery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: Arial, sans-serif;
            text-align: center;
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        /* Form styling */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        input[type="text"] {
            width: 50%;
            max-width: 400px;
            padding: 15px;
            font-size: 1.5rem;
            border: 2px solid #ccc;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            background-color: #0B6623;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Image container */
        .name-images {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            gap: 10px;
            width: 80%;
            max-width: 100vw;
            overflow-x: auto;
            white-space: nowrap;
            margin-top: 20px;
        }

        /* Image scaling */
        .name-images img {
            width: auto;
            height: 10vh;
            max-height: 100px;
            border: 3px solid black;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- Title -->
    <h1>Spell Your Name with Aerial Imagery</h1>

    <!-- Input form -->
    <form method="POST">
        <input type="text" name="name" placeholder="Enter your name" required>
        <button type="submit">Submit</button>
    </form>

    <!-- Display images dynamically in one row -->
    {% if images %}
        <div class="name-images">
            {% for img in images %}
                <img src="{{ img }}" alt="Letter">
            {% endfor %}
        </div>
    {% endif %}

</body>
</html>
