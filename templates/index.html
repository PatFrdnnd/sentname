<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Your Name with Satellite Images</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Main content container */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
        }

        form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px; /* Adds spacing between elements */
        }

        input[type="text"] {
            width: 80vw; /* 80% of viewport width */
            max-width: 500px; /* Max size for large screens */
            padding: 1rem;
            font-size: 1.5rem;
            border: 2px solid #ccc;
            border-radius: 10px;
        }

        button {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            background-color: #0B6623;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        label {
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            gap: 5px;
        }

        /* Image container to ensure images are in one row */
        .name-images {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap; /* Prevent wrapping to a new line */
            overflow-x: auto; /* Allow horizontal scrolling if needed */
            width: 100%;
            max-width: 100vw; /* Ensure images fit within the viewport width */
        }

        .name-images img {
            height: auto; /* Maintain aspect ratio */
            max-width: 10vw; /* Limit image size to 10% of viewport width */
            border: 3px solid black;
            border-radius: 5px;
        }

    </style>
</head>
<body>

    <!-- Main content -->
    <div class="content">
        <h1>Spell Your Name with Satellite Images</h1>
        <form method="POST">
            <input type="text" name="name" placeholder="Enter your name" required>
            
            <!-- Checkbox for AI images -->
            <label>
                <input type="checkbox" name="use_ai">
                AI
            </label>

            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- If images are submitted, display them -->
    {% if images %}
        <div class="name-images">
            {% for img in images %}
                <img src="{{ img }}" alt="Letter">
            {% endfor %}
        </div>
    {% endif %}

</body>
</html>
