<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Your Name with Satellite Images</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Centering content */
        .content {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            fley: 0 0 120px;
        }

        input[type="text"] {
            width: 80vw; /* 80% of viewport width */
            max-width: 500px; /* Max size for large screens */
            padding: 1rem;
            font-size: 1.5rem;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        button {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            background-color: #0B6623;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Image container to keep images in one row */
        .name-images {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap; /* Prevent wrapping to a new line */
            overflow-x: auto; /* Allow horizontal scrolling if needed */
            width: 100%;
            max-width: 100vw; /* Ensure images fit within the viewport width */
        }

        .name-images img {
            width: 10vw; /* Width is 10% of viewport width */
            height: auto; /* Maintain aspect ratio */
            flex-shrink: 1; /* Allow images to shrink */
            border: 3px solid black;
            border-radius: 5px;
        }

        /* Banner style */
        .banner-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 0;
        }

        .banner {
            width: 100%;
            height: auto;
            max-height: 100px; /* Set max height */
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Main content -->
    <div class="content">
        <h1>Spell Your Name with Satellite Images</h1>
        <form method="POST">
            <input type="text" name="name" placeholder="Enter your name" required>
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- If images are submitted, display them -->
    {% if images %}
        <div class="name-images">
            {% for img in images %}
                <img src="{{ img }}" alt="Letter">
            {% endfor %}
        </div>
    {% endif %}

    <!-- Banner at the bottom -->
    <div class="banner-container">
        <img src="/static/images/banner.png" alt="Banner" class="banner">
    </div>

</body>
</html>
