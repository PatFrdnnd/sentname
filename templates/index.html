<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Your Name with Satellite Images</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: Arial, sans-serif;
            width: 100%;
            height: 100%;
            overflow-x: hidden; /* Prevents horizontal scrolling */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centers everything vertically and horizontally */
        }

        /* Center the form and title */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Centering the headline and text box horizontally */
        input[type="text"] {
            width: 80vw; /* 80% of viewport width */
            max-width: 400px; /* Limit the size */
            padding: 1.5rem;
            font-size: 2rem;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        /* Responsive button */
        button {
            padding: 1rem 2rem;
            font-size: 2rem;
            background-color: #0B6623;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Flex container for images */
        .name-images {
            display: flex;
            flex-wrap: nowrap; /* Prevent images from wrapping into multiple rows */
            justify-content: center; /* Center images horizontally */
            gap: 10px;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }

        /* Image styling */
        .name-images img {
            flex-shrink: 1; /* Allow images to shrink if necessary */
            width: 10vw; /* Each image takes 10% of the viewport width */
            height: auto;
            border: 3px solid black;
            border-radius: 3px;
        }

        /* Banner fixes */
        .banner-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2vh 0;
        }

        .banner {
            width: 100%;
            height: auto;
            max-height: 100px; /* Set a max height for the banner */
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Main content -->
    <div class="content">
        <h1>Spell Your Name with Satellite Images</h1>
        <form method="POST">
            <input type="text" name="name" placeholder="Enter your name" required>
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- If images are submitted, display them -->
    {% if images %}
        <div class="name-images">
            <h2>Here is your name from above:</h2>
            {% for img in images %}
                <img src="{{ img }}" alt="Letter">
            {% endfor %}
        </div>
    {% endif %}

    <!-- Banner at the bottom -->
    <div class="banner-container">
        <img src="/static/images/banner.png" alt="Banner" class="banner">
    </div>

</body>
</html>
