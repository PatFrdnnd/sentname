<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Your Name with Satellite Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
        }

        /* Make form input box responsive */
        input[type="text"] {
            width: 80%; /* Increased width for mobile */
            max-width: 400px; /* Limits expansion on larger screens */
            padding: 15px;
            font-size: 1.5rem;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* Responsive button */
        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            background-color: #0B6623;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Responsive image container */
        .name-images {
            display: flex;
            flex-wrap: wrap; /* Ensures images stay within the container */
            justify-content: center; /* Centers images properly */
            gap: 10px; /* Adds space between images */
            max-width: 90%; /* Prevents excessive expansion */
            margin: 0 auto; /* Centers the container */
        }

        /* Responsive name images */
        .name-images img {
            width: clamp(80px, 10vw, 120px); /* Ensures images scale but stay within limits */
            height: auto;
            border: 3px solid black;
            border-radius: 3px;
        }

        /* Banner fixes */
        .banner-container {
            width: 100%;
            max-height: 150px; /* Prevent excessive height */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Ensures no overflow */
        }

        .banner {
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain; /* Ensures proper scaling */
        }
    </style>
</head>
<body>

    <!-- Main content -->
    <div>
        <h1>Spell Your Name with Satellite Images</h1>
        <form method="POST">
            <input type="text" name="name" placeholder="Enter your name" required>
            <button type="submit">Submit</button>
        </form>
    </div>

    <!-- If images are submitted, display them -->
    {% if images %}
        <div class="name-images">
            <h2>Here is your name from above:</h2>
            {% for img in images %}
                <img src="{{ img }}" alt="Letter">
            {% endfor %}
        </div>
    {% endif %}

    <!-- Banner at the bottom -->
    <div class="banner-container">
        <img src="/static/images/banner.png" alt="Banner" class="banner">
    </div>

</body>
</html>
